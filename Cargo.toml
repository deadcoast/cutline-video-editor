[package]
name = "cutline"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A focused native video viewer, trimmer and crop editor"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "accesskit"] }
libloading = "0.8"
parking_lot = "0.12"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
directories = "6.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
proptest = "1.9"

[build-dependencies]
winresource = "0.1"
